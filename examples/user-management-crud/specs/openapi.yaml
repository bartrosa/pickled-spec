openapi: 3.1.0
info:
  title: User management CRUD API
  version: 1.0.0
paths:
  /users:
    post:
      summary: Register a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: List users (admin only)
      operationId: listUsers
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      summary: Subject access — read profile
      operationId: getUser
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      summary: Rectify profile fields
      operationId: patchUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Trigger account erasure workflow
      operationId: deleteUser
      responses:
        "202":
          description: Erasure accepted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "410":
          $ref: "#/components/responses/Gone"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}/export:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      summary: Portable export of subject data
      operationId: exportUser
      responses:
        "200":
          description: JSON export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /users/{id}/erase:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      summary: Subject-initiated erase request
      operationId: requestErase
      responses:
        "202":
          description: Soft-delete scheduled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /privacy/consents:
    post:
      summary: Record consent grant or withdrawal
      operationId: recordConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConsentRecord"
      responses:
        "201":
          description: Recorded
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /privacy/policy:
    get:
      summary: Public privacy policy and contact
      operationId: getPrivacyPolicy
      responses:
        "200":
          description: Policy document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyPolicy"
        "500":
          $ref: "#/components/responses/InternalError"
  /breaches/notify:
    post:
      summary: Internal breach notification intake
      operationId: notifyBreach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreachNotice"
      responses:
        "202":
          description: Accepted for triage
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  parameters:
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        name:
          type: string
        consent_marketing:
          type: boolean
        consent_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
        hard_delete_after:
          type: string
          format: date-time
          nullable: true
    UserCreate:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
        name:
          type: string
        consent_marketing:
          type: boolean
    UserUpdate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
    UserExport:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        consent_marketing:
          type: boolean
        consent_at:
          type: string
    ConsentRecord:
      type: object
      required: [purpose, granted]
      properties:
        purpose:
          type: string
        granted:
          type: boolean
    PrivacyPolicy:
      type: object
      properties:
        privacy_contact_email:
          type: string
        policy_version:
          type: string
    BreachNotice:
      type: object
      required: [severity, scope_summary]
      properties:
        severity:
          type: string
        scope_summary:
          type: string
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: Resource removed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
