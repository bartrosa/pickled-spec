[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "gitlint>=0.19.1",
    "pre-commit>=4.0",
    "pickled-core[all-providers]",
    "pickled-core[mcp]",
]

[tool.uv.sources]
pickled-core = { workspace = true }
pickled-bdd = { workspace = true }
pickled-rules = { workspace = true }
pickled-schema = { workspace = true }
pickled-iac = { workspace = true }
pickled-data = { workspace = true }
pickled-diff = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]
exclude = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = "gherkin.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["anthropic.*", "openai.*", "google.*", "google.genai.*", "tenacity.*", "ulid.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "openapi_spec_validator.*",
    "jsonschema.*",
    "grpc_tools.*",
    "google.protobuf.*",
    "sqlglot.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
addopts = "-q --import-mode=importlib"
