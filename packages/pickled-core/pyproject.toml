[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickled-core"
version = "0.1.0.dev0"
description = "Shared types, gate protocol, and infrastructure for the pickled-* family."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bart Rosa" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pydantic>=2.10",
    "python-ulid>=3.0",
    "pyyaml>=6.0.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
gemini = ["google-genai>=1.0"]
all-providers = ["anthropic>=0.40", "openai>=1.50", "google-genai>=1.0"]
mcp = ["mcp>=1.27.1", "fastmcp>=3.3.1,<4.0"]
mine = [
    "pickled-bdd",
    "pickled-rules",
]

[project.scripts]
pickled-spec = "pickled_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pickled_core"]
