[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tiny-target"
version = "0.0.1"
description = "Minimal fixture for mine inventory tests"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
tiny-target = "tiny_target.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_target"]
