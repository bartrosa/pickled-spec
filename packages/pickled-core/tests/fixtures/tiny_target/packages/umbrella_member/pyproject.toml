[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "umbrella-member"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["click>=8.1"]

[project.scripts]
pickled-spec = "umbrella_member.cli:main"

[project.entry-points."pickled.mcp.subservers"]
bdd = "umbrella_member.mcp:build_server"

[tool.hatch.build.targets.wheel]
packages = ["src/umbrella_member"]
