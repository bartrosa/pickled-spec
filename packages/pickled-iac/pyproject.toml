[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickled-iac"
version = "0.1.0.dev0"
description = "LLM-to-Terraform bridge with plan diff and optional Trivy security scanning."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Bart Rosa" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pickled-core",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
security = []
mcp = ["pickled-core[mcp]"]

[project.scripts]
pickled-iac = "pickled_iac.cli:main"

[project.entry-points."pickled.mcp.subservers"]
iac = "pickled_iac.mcp_cli:build_server"

[tool.uv.sources]
pickled-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pickled_iac"]

[tool.hatch.build.targets.wheel.force-include]
"src/pickled_iac/prompts" = "pickled_iac/prompts"
