[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pickled-data"
version = "0.1.0.dev0"
description = "SQL migration parsing, sandbox oracle, and schema contract gates."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Bart Rosa" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "pickled-core",
    "PyYAML>=6.0.2",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
cross-contract = ["pickled-schema"]
mcp = ["pickled-core[mcp]", "pickled-schema"]

[project.scripts]
pickled-data = "pickled_data.cli:main"

[project.entry-points."pickled.mcp.subservers"]
data = "pickled_data.mcp_cli:build_server"

[tool.uv.sources]
pickled-core = { workspace = true }
pickled-schema = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pickled_data"]
